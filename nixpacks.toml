# Adds system packages/tools the Node app shells out to, alongside
# Railway's auto-detected Node.js/npm setup. The '...' keeps the
# auto-detected packages instead of replacing them.
#
# yt-dlp is pulled directly from its own GitHub releases at build time,
# rather than through nixPkgs, because Railway's Nix package snapshot can
# lag months behind yt-dlp's own release cadence — and yt-dlp ships fixes
# for YouTube's anti-bot changes very frequently, so staying current
# matters here more than it would for most tools.
[phases.setup]
nixPkgs = ['...', 'ffmpeg', 'curl', 'unzip']

[phases.ytdlp]
cmds = [
  'curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o /usr/local/bin/yt-dlp',
  'chmod a+rx /usr/local/bin/yt-dlp',
]
dependsOn = ['setup']

# YouTube's PO Token requirement eventually blocks every "pretend to be a
# client that doesn't need one" trick (see src/config.js's ytPlayerClients
# comment). The durable fix is a real PO Token provider: this plugin lets
# yt-dlp fetch tokens from a companion server (deployed as its own Railway
# service running the brainicism/bgutil-ytdlp-pot-provider Docker image —
# see the README) instead of guessing at client names. Installed by
# unzipping the plugin release into a folder yt-dlp is told to scan via
# --plugin-dirs (see src/music/ytdlp.js).
#
# The extra "pkg" subfolder here is NOT decorative — it's required by how
# yt-dlp's plugin loader actually works, verified by reading its source
# (yt_dlp/plugins.py) and testing directly: a --plugin-dirs path has its
# *immediate children* treated as separate plugin packages, and each of
# THOSE is searched for a yt_dlp_plugins/<type>/ folder inside it. Unzipping
# straight into /opt/yt-dlp-plugins (so yt_dlp_plugins/ sits directly under
# it) makes the loader look for /opt/yt-dlp-plugins/yt_dlp_plugins/yt_dlp_plugins/...
# — one level too deep — and it silently finds nothing (yt-dlp doesn't
# error on this, it just reports zero plugins loaded, which is exactly the
# "PO Token Providers: none" / "Plugin directories: none" we kept seeing
# no matter what else we changed). Extracting into a named subfolder
# (/opt/yt-dlp-plugins/pkg/yt_dlp_plugins/...) makes that subfolder the
# "package" the loader finds, with yt_dlp_plugins/ correctly one level
# inside it — confirmed working by testing this exact layout locally
# against the real yt-dlp binary before shipping it here.
[phases.potplugin]
cmds = [
  'mkdir -p /opt/yt-dlp-plugins/pkg',
  'curl -L https://github.com/Brainicism/bgutil-ytdlp-pot-provider/releases/latest/download/bgutil-ytdlp-pot-provider.zip -o /tmp/bgutil-plugin.zip',
  'unzip -o /tmp/bgutil-plugin.zip -d /opt/yt-dlp-plugins/pkg',
  'rm /tmp/bgutil-plugin.zip',
]
dependsOn = ['ytdlp']
